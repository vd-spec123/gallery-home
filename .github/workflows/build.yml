name: Build Gallery Home

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk GalleryHome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GalleryHome
          path: GalleryHome.apk

      # A fixed "latest" release so the TV can always download from the same address.
      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GalleryHome.apk --title "Gallery Home build ${{ github.run_number }}" --notes "Built from ${{ github.sha }}"
